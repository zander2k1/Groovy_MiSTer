name: Build core

# Builds the Groovy core with Quartus 17.0.2 Lite.
# - Pushes to main publish the core as the "latest" release.
# - Pushes to any other branch only attach it to the workflow run, for testing.

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Compile with Quartus 17.0.2 Lite
        run: |
          chmod -R a+rwX .
          docker run --rm -v "$PWD":/project -w /project \
            theypsilon/quartus-lite-c5:17.0.2 \
            quartus_sh --flow compile Groovy
          ls -l output_files

      - name: Name the build
        run: |
          date=$(date -u +%Y%m%d)
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            name="Groovy_${date}.rbf"
          else
            name="Groovy_${date}_test_$(git rev-parse --short HEAD).rbf"
          fi
          cp output_files/Groovy.rbf "$name"
          echo "RBF=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Groovy-core
          path: ${{ env.RBF }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quartus-reports
          path: |
            output_files/*.rpt
            output_files/*.summary
          if-no-files-found: ignore

      - name: Publish the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7}. Copy ${RBF} to /media/fat/_Utility on the MiSTer."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RBF" --title "Groovy core (latest build)" --notes "$notes" --target "$GITHUB_SHA"
